name: Qutebrowser Energy CI
run-name: Eco-CI on Qutebrowser

on:
  push:
    branches:
      - feature/set-eco-ci
  pull_request:
    branches:
      - feature/set-eco-ci

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-22.04  # Prefer 22.04 for Qt testing compatibility
    env:
      QUTE_QT_WRAPPER: PyQt5

    steps:
    - name: Start Eco-CI Measurement
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: start-measurement

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          libegl1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
          libxcb-shape0 libxcb-cursor0 libjpeg-dev xvfb dbus

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r misc/requirements/requirements-tox.txt
        python -m pip install PyQt5

    - name: Measure Dependency Install Energy
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: get-measurement
        label: 'dependency install'

    - name: Run Tests with Tox
      run: |
        dbus-run-session -- xvfb-run -a tox -e py

    - name: Measure Test Run Energy
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: get-measurement
        label: 'tox -e py'

    - name: Display Energy Results
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: display-results

