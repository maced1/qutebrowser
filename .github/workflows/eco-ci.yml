name: Qutebrowser Energy CI
run-name: Eco-CI on Qutebrowser

on:
  push:
    branches:
      - feature/set-eco-ci
  pull_request:
    branches:
      - feature/set-eco-ci

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      QUTE_QT_WRAPPER: PyQt

    steps:
    - name: Start Measurement
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: start-measurement

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Match .python-version or tox envs

    - name: Install system dependencies for Qt testing
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends \
          libegl1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
          libxcb-shape0 libxcb-cursor0 libjpeg-dev xvfb dbus

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r misc/requirements/requirements-tox.txt

    - name: Get measurement - dependency install
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: get-measurement
        label: 'dependency install'
      continue-on-error: true
  
    - name: Run tests with tox in headless mode
      run: |
        export QUTE_QT_WRAPPER=PyQt5
        dbus-run-session -- xvfb-run -a tox -e py


    - name: Get measurement - test run
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: get-measurement
        label: 'tox -e py'
      continue-on-error: true

    - name: Display energy results
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: display-results
      continue-on-error: true

    # - name: Upload Eco-CI Report
    #   uses: actions/upload-artifact@v4
